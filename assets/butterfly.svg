<!-- Inherits currentColor. class="busy" doubles the flap rate; class="idle" freezes mid-pose. -->
<svg xmlns="http://www.w3.org/2000/svg" class="butterfly" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
  <style>
    .butterfly { perspective: 90px; overflow: visible; }
    .butterfly .wing {
      fill: currentColor;
      transform-box: view-box;
      transform-origin: center;
      animation: 0.9s ease-in-out infinite;
    }
    .butterfly .wing.left  { animation-name: flap-left; }
    .butterfly .wing.right { animation-name: flap-right; }
    .butterfly .body { fill: currentColor; }
    .butterfly .antenna {
      fill: none;
      stroke: currentColor;
      stroke-width: 1;
      stroke-linecap: round;
    }
    .butterfly.busy { opacity: 0.7; }
    .butterfly.busy .wing { animation-duration: 0.45s; }
    .butterfly.idle .wing { animation-play-state: paused; }
    @keyframes flap-left {
      0%, 100% { transform: rotateY(12deg); }
      50%      { transform: rotateY(68deg); }
    }
    @keyframes flap-right {
      0%, 100% { transform: rotateY(-12deg); }
      50%      { transform: rotateY(-68deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .butterfly .wing { animation: none; }
    }
  </style>
  <g class="wing left">
    <circle cx="7.2" cy="9" r="4.8" />
    <circle cx="8.2" cy="16" r="3.6" />
  </g>
  <g class="wing right">
    <circle cx="16.8" cy="9" r="4.8" />
    <circle cx="15.8" cy="16" r="3.6" />
  </g>
  <rect class="body" x="11.15" y="7.4" width="1.7" height="10" rx="0.85" />
  <path class="antenna" d="M11.7 7.6 C11.1 5.8 10 4.6 8.8 3.9" />
  <path class="antenna" d="M12.3 7.6 C12.9 5.8 14 4.6 15.2 3.9" />
</svg>
