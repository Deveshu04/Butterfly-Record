[package]
name = "butterfly-record-desktop"
version = "0.1.0"
description = "Butterfly Record for Windows."
license = "MIT"
edition = "2021"

[lib]
name = "butterfly_record_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "multipart", "stream"] }
keyring = { version = "3", features = ["windows-native"] }
trash = "5"
thiserror = "2"
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
