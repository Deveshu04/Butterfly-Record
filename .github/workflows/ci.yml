name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Check, test and build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm -r check

      - name: Test packages
        run: pnpm -r test

      - name: Test scripts
        run: node --test scripts/set-version.test.mjs

      - name: Build the extension
        run: pnpm build

      - name: Build the desktop frontend
        run: pnpm --filter @butterfly-record/desktop vite:build

      - name: cargo fmt
        working-directory: packages/desktop/src-tauri
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: packages/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: packages/desktop/src-tauri
        run: cargo test
